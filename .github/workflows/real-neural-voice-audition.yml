name: Audition real pretrained neural voice on generated speech
on:
  workflow_dispatch:
  push:
    paths:
      - "tests/test_pretrained_voice.cjs"
      - ".github/workflows/real-neural-voice-audition.yml"
permissions:
  contents: read
jobs:
  voice-audition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install speech fixture generator and audio converter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          npm install --no-audit --no-fund --silent --no-save onnxruntime-web@1.22.0
      - name: Synthesize a male speech fixture (no private voice recording)
        run: |
          mkdir -p /tmp/irl-voice-audio-test
          espeak-ng -v en-us+m3 -s 140 -w /tmp/irl-voice-audio-test/male.wav \
            "Hello! This is a short voice sample. We are testing whether a neural voice conversion model changes how a man sounds when he speaks. The result should have a clearly different speaker character, not just a tiny change in the microphone signal. Please listen to the source recording and the converted recording."
          ffmpeg -v error -y -i /tmp/irl-voice-audio-test/male.wav \
            -ac 1 -ar 16000 -f f32le /tmp/irl-voice-audio-test/input.f32
          test "$(wc -c </tmp/irl-voice-audio-test/input.f32)" -gt 160000
      - name: Download exact 13.7 MB real neural ONNX model
        run: |
          curl -fLSs --retry 3 --max-time 180 \
            -o /tmp/irl-voice-audio-test/female_voice_hfg_new.onnx \
            https://raw.githubusercontent.com/ultrapg/hevoicechanger/main/models/female_voice_hfg_new.onnx
          test "$(wc -c </tmp/irl-voice-audio-test/female_voice_hfg_new.onnx)" -eq 13756183
      - name: Run true ONNX Runtime Web WASM converted-voice inference
        run: node tests/test_pretrained_voice.cjs
      - name: Upload input and ONNX converted output for human listening comparison
        uses: actions/upload-artifact@v4
        with:
          name: real-pretrained-13mb-ondevice-onnx-audition
          path: |
            /tmp/irl-voice-audio-test/voice-source.wav
            /tmp/irl-voice-audio-test/voice-onnx-13mb.wav
            /tmp/irl-voice-audio-test/voice-onnx-plus6-dsp.wav
            /tmp/irl-voice-audio-test/metrics.json
          retention-days: 30
