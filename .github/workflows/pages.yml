name: Deploy IRL website, online model lab and Pocket ONNX
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "online-test/**"
      - "live-vc/**"
      - "pocket-demo/**"
      - "tests/test_web_studio.py"
      - "tests/test_live_voice.cjs"
      - "tests/test_rvc_live.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: https://tbenitz.github.io/IRL-Voice-Changer/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate real Pocket runtime and online demo files
        shell: bash
        run: |
          set -euo pipefail
          test -f online-test/index.html
          test -f live-vc/index.html
          test -f live-vc/live-processor.js
          test -f live-vc/rvc-mic-worklet.js
          test -f live-vc/rvc-stream-worker.js
          test -f live-vc/rvc-live-ui.js
          test -f pocket-demo/index.html
          test -f pocket-demo/diagnostics.html
          test -f pocket-demo/studio/index.html
          test -f pocket-demo/studio/pocket-mic-addon.js
          test -f pocket-demo/studio/app.js
          test -f pocket-demo/studio/PCMPlayerWorklet.js
          test -f pocket-demo/studio/inference-worker.js
          test -f pocket-demo/studio/studio-addon.js
          test -f pocket-demo/studio/vendor/lame.min.js
          test "$(wc -c < pocket-demo/studio/sentencepiece.js)" -gt 3000000
          node --check live-vc/live-processor.js
          node --check live-vc/rvc-mic-worklet.js
          node --check live-vc/rvc-stream-worker.js
          node --check live-vc/rvc-live-ui.js
          node tests/test_live_voice.cjs
          node tests/test_rvc_live.cjs
          node --check pocket-demo/studio/pocket-mic-addon.js
          node --check pocket-demo/studio/inference-worker.js
          node --input-type=module --check < pocket-demo/studio/app.js
          node --input-type=module --check < pocket-demo/studio/PCMPlayerWorklet.js
          node --input-type=module --check < pocket-demo/studio/studio-addon.js
          node --check pocket-demo/studio/main-thread-worker-shim.js
          python3 tests/test_web_studio.py
          node --check pocket-demo/studio/sentencepiece.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ("online-test/index.html", "live-vc/index.html", "pocket-demo/index.html",
                       "pocket-demo/diagnostics.html"):
              content = Path(name).read_text(encoding="utf-8")
              blocks = re.findall(r"<script[^>]*>([\s\S]*?)</script>", content)
              for i, body in enumerate(blocks):
                  Path("/tmp/inline_" + Path(name).parent.name + "_" + str(i) + ".js").write_text(body, encoding="utf-8")
          PY
          for code in /tmp/inline_*.js; do node --check "$code"; done
          echo "Real Pocket tokenizer and inference worker are present."
      - name: Assemble static site with locally committed Pocket runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html
          cp -a pocket-demo _site/pocket-demo
          cp -a online-test _site/online-test
          cp -a live-vc _site/live-vc
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
