name: Benchmark tiny causal voice converter in browser WASM
on:
  push:
    paths:
      - ".github/workflows/llvc-browser-bench.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install local ONNX Runtime Web for CPU WASM benchmark
        run: |
          mkdir -p /tmp/tinyvc
          npm --prefix /tmp/tinyvc install --silent --no-audit --no-fund onnxruntime-web@1.22.0
      - name: Download published 13.7 MB neural streaming voice checkpoint
        run: |
          curl -fLSs --retry 3 --max-time 180 -o /tmp/tinyvc/model.onnx \
            https://raw.githubusercontent.com/ultrapg/hevoicechanger/main/models/female_voice_hfg_new.onnx
          test "$(wc -c </tmp/tinyvc/model.onnx)" -eq 13756183
      - name: Measure genuine ONNX Runtime Web WASM inference and real-time factor
        timeout-minutes: 9
        run: |
          node <<'JS'
          const fs=require("node:fs");
          const ort=require("/tmp/tinyvc/node_modules/onnxruntime-web");
          (async()=>{
           ort.env.wasm.wasmPaths="/tmp/tinyvc/node_modules/onnxruntime-web/dist/";
           ort.env.wasm.numThreads=1;
           ort.env.wasm.proxy=false;
           const session=await ort.InferenceSession.create(
             fs.readFileSync("/tmp/tinyvc/model.onnx"),{
               executionProviders:["wasm"],
               graphOptimizationLevel:"basic",
               enableMemPattern:false
             });
           console.log("TINY VC INPUT NAMES",session.inputNames,
             "metadata",JSON.stringify(session.inputMetadata));
           console.log("TINY VC OUTPUT NAMES",session.outputNames);
           for(const history of [2048,4096,8000,16000]){
            for(const chunkSize of [2048,4096,8192]){
             const results=[];
             let last=null;
             for(let i=0;i<5;i++){
              const len=history+chunkSize;
              const input=new Float32Array(len);
              for(let j=0;j<len;j++)input[j]=0.15*Math.sin(2*Math.PI*220*(j+i*chunkSize)/16000);
              const feeds={audio_in:new ort.Tensor("float32",input,[1,1,len])};
              const start=performance.now();
              const out=await session.run(feeds);
              const time=performance.now()-start;
              last=out.audio_out||out[session.outputNames[0]];
              if(!last?.data?.every(Number.isFinite))throw Error("Nonfinite output");
              if(last.data.length<len)throw Error("Output too short "+last.data.length);
              results.push(time);
             }
             const afterWarm=results.slice(1);
             const avg=afterWarm.reduce((a,b)=>a+b,0)/afterWarm.length;
             const rtf=avg/(chunkSize/16000*1000);
             console.log("TINY VC BENCH",JSON.stringify({
               history,chunkSize,chunkMs:chunkSize/16,inferenceMs:+avg.toFixed(2),
               rtf:+rtf.toFixed(3),outputSamples:last.data.length
             }));
            }
           }
           console.log("PASS: tiny causal neural voice checkpoint runs real conversion in ONNX Runtime Web WASM");
           await session.release();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
