name: Custom neural voice training source checks
on:
  push:
    paths:
      - "voice-training/**"
      - "pocket-demo/studio/full-voice-builder.js"
      - ".github/workflows/voice-training-syntax.yml"
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python training programs
        run: |
          python -m py_compile voice-training/generate_teacher_pairs.py voice-training/train_full_llvc.py voice-training/colab_setup.py voice-training/one_click_pipeline.py voice-training/hf-space/app.py voice-training/job_worker.py voice-training/tests/test_durable_jobs.py voice-training/tests/test_smoke.py
      - name: Check notebook structure and execution commands
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          notebook=json.loads(Path('voice-training/train_real_voice.ipynb').read_text())
          assert notebook['nbformat']==4
          assert len(notebook['cells'])>=8
          script="\n".join("".join(c.get('source',[])) for c in notebook['cells'])
          for required in ["files.upload()", "generate_teacher_pairs.py", "train_full_llvc.py", "files.download"]:
              assert required in script, required
          print("Notebook source valid; GPU execution still requires a live runtime")
          PY
      - name: Check one-click notebook compiles and handles 400 pairs / one bundle
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          note=json.loads(Path('voice-training/one_click_voice.ipynb').read_text())
          assert note["nbformat"] == 4
          for i, cell in enumerate(note["cells"]):
              if cell["cell_type"] == "code":
                  ast.parse("".join(cell["source"]), filename=f"one_click_voice.ipynb:{i}")
          src=Path("voice-training/one_click_pipeline.py").read_text()
          assert 'MAX_SECONDS = 7200.0' in src
          assert 'ANALYZE_SECONDS = 180' in src
          assert '"--pairs"' in src
          assert 'zipfile.ZipFile' in src
          assert '"G_{steps}.pth"' in src
          assert '.onnx' in src
          print("One-click notebook and orchestrator source valid (GPU run not executed)")
          PY
      - name: CPU regression tests: audio QA, refresh recovery, detached jobs, download and failure paths
        run: |
          python voice-training/tests/test_smoke.py
          python voice-training/tests/test_durable_jobs.py
      - name: Check studio entry script
        run: node --check pocket-demo/studio/full-voice-builder.js
