name: Build Windows portable EXE
on:
  push:
    branches: [main]
    paths:
      - "hub.py"
      - "engines.py"
      - "tests/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python sources and adapters
        shell: pwsh
        run: |
          python -m compileall -q hub.py engines.py
          python -m unittest discover -s tests -v
      - name: Build self-contained Windows launcher
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.12,<7"
          pyinstaller --noconfirm --clean --onefile --windowed --name IRL-Voice-Changer hub.py
      - name: Publish portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: IRL-Voice-Changer-Windows-x64
          path: dist/IRL-Voice-Changer.exe
          if-no-files-found: error
          retention-days: 30
