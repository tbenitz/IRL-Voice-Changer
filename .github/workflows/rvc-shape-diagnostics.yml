name: Probe real RVC ONNX dimensions
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rvc-shape-diagnostics.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU ONNX inference runtime
        run: |
          python -m pip install --quiet --disable-pip-version-check "onnxruntime==1.22.1" "onnx>=1.19" "numpy<2"
      - name: Download exact ContentVec and built-in voice ONNX models
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 --max-time 360 -o /tmp/contentvec.onnx \
            "https://huggingface.co/ampixa/rvc-browser-runtime/resolve/main/contentvec.fp16.onnx"
          curl -fLSs --retry 3 --max-time 360 -o /tmp/voice.onnx \
            "https://huggingface.co/ampixa/nepali-rvc-voices-v1/resolve/45908909e0e1b01ae45c8254ef939045d221b510/browser/ne_rvc_m01.512.fp16.onnx"
          curl -fLSs --retry 3 --max-time 360 -o /tmp/rmvpe.onnx \
            "https://huggingface.co/ampixa/rvc-browser-runtime/resolve/main/rmvpe.fp16.onnx"
          wc -c /tmp/contentvec.onnx /tmp/voice.onnx /tmp/rmvpe.onnx
          test "$(wc -c < /tmp/rmvpe.onnx)" -eq 181070368
          test "$(wc -c < /tmp/contentvec.onnx)" -eq 189437475
      - name: Run actual ContentVec ONNX and print exact output axes
        run: |
          python - <<'PY'
          import numpy as np
          import onnxruntime as ort
          print("onnxruntime:", ort.__version__, flush=True)
          opt=ort.SessionOptions()
          opt.intra_op_num_threads=1
          opt.inter_op_num_threads=1
          # ONNX Runtime CPU 1.24+ introduced an unrelated SimplifiedLayerNorm
          # constant-fold fusion crash on this FP16 graph; the browser uses
          # ORT Web 1.22 basic optimizations instead.
          opt.graph_optimization_level=ort.GraphOptimizationLevel.ORT_DISABLE_ALL
          cv=ort.InferenceSession("/tmp/contentvec.onnx",sess_options=opt,providers=["CPUExecutionProvider"])
          print("CONTENTVEC INPUTS",[(x.name,x.shape,x.type) for x in cv.get_inputs()],flush=True)
          print("CONTENTVEC OUTPUTS",[(x.name,x.shape,x.type) for x in cv.get_outputs()],flush=True)
          # Inspect generator graph without loading it into newer CPU ORT:
          # this FP16 voice has an unrelated Cast graph rewrite issue in ORT 1.24.
          import onnx
          voice=onnx.load("/tmp/voice.onnx",load_external_data=False)
          def dims(t):
              ds=t.type.tensor_type.shape.dim
              return [d.dim_value if d.HasField("dim_value") else d.dim_param for d in ds]
          print("RVC GENERATOR INPUTS",[(x.name,dims(x)) for x in voice.graph.input],flush=True)
          print("RVC GENERATOR OUTPUTS",[(x.name,dims(x)) for x in voice.graph.output],flush=True)
          rm=onnx.load("/tmp/rmvpe.onnx",load_external_data=False)
          print("RMVPE INPUTS",[(x.name,dims(x)) for x in rm.graph.input],flush=True)
          print("RMVPE OUTPUTS",[(x.name,dims(x)) for x in rm.graph.output],flush=True)
          n=16000
          audio=(np.sin(np.arange(n,dtype=np.float32)*np.float32(2*np.pi*220/16000))*.12).astype("float32")
          feeds={}
          for x in cv.get_inputs():
              if x.name in ("source","audio","input","waveform"):
                  feeds[x.name]=audio.reshape((1,1,n) if len(x.shape)==3 else (1,n))
              elif x.name=="padding_mask":
                  feeds[x.name]=np.zeros([1,n],dtype=bool)
              elif x.name=="output_layer":
                  feeds[x.name]=np.asarray([12],dtype="int64")
              else:
                  raise Exception("Unknown ContentVec input: "+x.name)
          result=cv.run(None, feeds)
          for desc,arr in zip(cv.get_outputs(), result):
              print("CONTENTVEC ACTUAL",desc.name,"shape=",arr.shape,"dtype=",arr.dtype,
                  "range=",np.nanmin(arr),np.nanmax(arr),flush=True)
          expected=next((dims(i)[-1] for i in voice.graph.input if i.name=="phone"),None)
          assert expected in (768,256),f"Unexpected generator phone dimension {expected}"
          matching=[(desc.name,arr.shape) for desc,arr in zip(cv.get_outputs(),result)
                    if arr.ndim==3 and expected in arr.shape[1:]]
          print("MATCHED",matching,"EXPECTED PHONE WIDTH",expected,flush=True)
          assert matching,"ContentVec graph does not output the required generator feature width"
          expected_rm=rm.graph.input[0]
          print("PITCH INPUT CONTRACT",expected_rm.name,dims(expected_rm),flush=True)
          assert len(dims(expected_rm)) in (2,3),"Unsupported RMVPE input rank"

          # CPU execution with ORT 1.22 is a compatibility smoke test, not a
          # Chromebook browser latency benchmark. This uses the three real ONNX files.
          import time
          print("START LIVE MODEL SMOKE",flush=True)
          rm_session=ort.InferenceSession("/tmp/rmvpe.onnx",sess_options=opt,providers=["CPUExecutionProvider"])
          f0raw=rm_session.run(None,{"waveform":audio.reshape(1,-1),
                       "threshold":np.asarray([.03],dtype=np.float32)})[0]
          print("REAL RMVPE",f0raw.shape,"range",float(np.nanmin(f0raw)),float(np.nanmax(f0raw)),flush=True)
          assert np.all(np.isfinite(f0raw)),"RMVPE returned nonfinite output"
          print("PASS: real ContentVec and RMVPE produced finite features and pitch; generator is tested with ONNX Runtime Web below.",flush=True)
          PY

      - name: Run real RVC generator on the same ONNX Runtime Web WASM backend as Chrome
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rvc-web-smoke
          npm --prefix /tmp/rvc-web-smoke install --no-audit --no-fund --silent onnxruntime-web@1.22.0
          node <<'JS'
          const fs=require("node:fs");
          const path=require("node:path");
          const ort=require("/tmp/rvc-web-smoke/node_modules/onnxruntime-web");
          (async()=>{
            ort.env.wasm.wasmPaths="/tmp/rvc-web-smoke/node_modules/onnxruntime-web/dist/";
            ort.env.wasm.numThreads=1;
            ort.env.wasm.proxy=false;
            const bytes=fs.readFileSync("/tmp/voice.onnx");
            const start=performance.now();
            const ses=await ort.InferenceSession.create(bytes,{
              executionProviders:["wasm"],graphOptimizationLevel:"basic",
              enableCpuMemArena:false,enableMemPattern:false
            });
            console.log("WEB WASM MODEL INITIALIZED",ses.inputNames,ses.outputNames,
              Math.round(performance.now()-start)+"ms");
            const phone=new Float32Array(512*768).fill(.12);
            const pitch=new BigInt64Array(512).fill(100n);
            const f0=new Float32Array(512).fill(220);
            const noise=new Float32Array(192*512);
            for(let i=0;i<noise.length;i++)noise[i]=.05*Math.sin(i*1.23);
            const inputs={
              phone:new ort.Tensor("float32",phone,[1,512,768]),
              phone_lengths:new ort.Tensor("int64",new BigInt64Array([512n]),[1]),
              pitch:new ort.Tensor("int64",pitch,[1,512]),
              nsff0:new ort.Tensor("float32",f0,[1,512]),
              sid:new ort.Tensor("int64",new BigInt64Array([0n]),[1]),
              noise:new ort.Tensor("float32",noise,[1,192,512])
            };
            const startRun=performance.now();
            const outputs=await ses.run(inputs);
            const wav=outputs.audio||outputs[ses.outputNames[0]];
            console.log("WEB WASM ACTUAL AUDIO",wav.dims,wav.data.length,
              "elapsed_ms",Math.round(performance.now()-startRun),
              "minmax",[Math.min(...wav.data.slice(0,10000)),Math.max(...wav.data.slice(0,10000))]);
            if(wav.data.length!==245760 || !wav.data.every(Number.isFinite))
              throw Error("RVC generator output missing or nonfinite");
            console.log("PASS: real downloaded RVC generator completed inference in ONNX Runtime Web WASM");
            await ses.release();
          })().catch(e=>{console.error("Real RVC WASM generator failure",e);process.exitCode=1});
          JS
